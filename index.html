<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiniela Mediamarkera</title><link rel="stylesheet" href="/style.css">
<style>
.admin-box{background:#151a1f;border:1px solid #3a4149;border-radius:17px;padding:18px;margin-top:15px}.admin-box h3{margin:0 0 12px}.admin-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.admin-row input,.admin-row select{flex:1;min-width:120px;padding:11px;border-radius:9px;border:1px solid #424850;background:#20252b;color:#fff}.admin-btn{border:0;border-radius:9px;padding:10px 12px;background:#e30613;color:#fff;font-weight:800}.admin-btn.secondary{background:#30363d}.admin-btn.danger{background:#8e1118}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:10px 6px;border-bottom:1px solid #30363d;text-align:left;font-size:13px}.admin-table th{color:#aeb4bc}.admin-user-card{padding:12px 0;border-bottom:1px solid #30363d}.admin-user-card:last-child{border-bottom:0}.admin-note{color:#9ea5ae;font-size:12px}.admin-tabs{display:flex;gap:8px;margin-bottom:14px}.admin-tabs button{flex:1;border:1px solid #414850;background:#20252b;color:#fff;border-radius:9px;padding:10px;font-weight:800}.admin-tabs button.active{background:#e30613;border-color:#e30613}.admin-match{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #30363d}.admin-match select{background:#20252b;color:#fff;border:1px solid #424850;border-radius:8px;padding:7px}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="/rfmf_logo.svg" alt="RFMF"><div><span>QUINIELA</span> <b>MEDIAMARKERA</b></div></div><div class="account" id="account">RFM <span>⌄</span></div></header>
<main>
<section class="hero"><div class="round-nav"><button id="prev">‹</button><div><h1>JORNADA <strong id="round">5</strong></h1><p>LaLiga 2026/2027</p></div><button id="next">›</button></div><div class="open"><i></i> ABIERTA</div></section>
<section class="prize"><div><small>PREMIO POR ACIERTO</small><strong>100.000 €</strong></div><div class="live" id="liveText">● RESULTADOS EN TIEMPO REAL</div></section>
<div class="quick"><button id="betTab">📝 <span>Mi apuesta</span></button><button id="resultTab">📊 <span>Resultados</span></button><button id="adminTab" class="hidden">⚙️ <span>Administración</span></button></div>
<section id="summary" class="summary hidden"><div class="sum-head"><span>🏆 RESUMEN DE MI APUESTA</span><strong id="prize">0 €</strong></div><div class="stats"><div><b id="hits">0</b><small>ACIERTOS</small></div><div><b id="pending">0</b><small>PENDIENTES</small></div><div><b id="errors">0</b><small>FALLOS</small></div></div><div id="roundSummary" style="margin-top:14px"></div></section>
<section id="matches" class="matches"></section>
<button id="save" class="save">💾 &nbsp; GUARDAR MI APUESTA</button>
<section id="admin" class="hidden"><div class="admin-box"><div class="sum-head"><span>⚙️ ADMINISTRACIÓN</span></div><div id="adminContent" style="margin-top:15px"></div></div></section>
</main>
<footer><button class="active" id="bottomRound">⚽<small>Jornada</small></button><button id="bottomBet">📝<small>Mi apuesta</small></button><button id="bottomResults">📊<small>Resultados</small></button><button onclick="location.href='/logout'">↪<small>Salir</small></button></footer>
<script>
let round=5,matches=[];const state={};const eur=n=>new Intl.NumberFormat('es-ES').format(n)+' €';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getPred(id){return state[id]?.pick||null} function setPred(id,p){state[id]={...(state[id]||{}),pick:p}}
function render(){const root=document.getElementById('matches');root.innerHTML='';matches.forEach((m,i)=>{const p=getPred(m.id),a=m.actual;let label='PENDIENTE',cls='pending';if(m.live){label=(m.status_label||'EN JUEGO')+(m.elapsed?' · '+m.elapsed+"'":'');cls='liveStatus'}else if(a){if(p===a){label='✓ ACIERTO · +100.000 €';cls='hit'}else if(p){label='✕ FALLADO';cls='miss'}else{label='RESULTADO';cls='result'}}else if(m.status==='postponed'||m.status==='PST'){label='APLAZADO'}else if(m.status==='canceled'||m.status==='CANC'){label='CANCELADO';cls='miss'}const article=document.createElement('article');article.className='match';article.innerHTML=`<div class="number">${i+1}</div><div class="teams"><div>${esc(m.home)}</div><div>${esc(m.away)}</div></div><div class="choices">${['1','X','2'].map(v=>`<button class="${p===v?'selected':''}" data-id="${esc(m.id)}" data-pick="${v}">${v}</button>`).join('')}<div class="status ${cls}">${m.score?esc(m.score)+' · ':''}${label}</div></div>`;root.appendChild(article)});root.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{setPred(b.dataset.id,b.dataset.pick);render()})}
async function load(){try{const r=await fetch('/api/matches?round='+round,{cache:'no-store'});if(!r.ok){location.href='/login';return}const d=await r.json();matches=d.matches||[];document.getElementById('liveText').textContent=d.api_error?'● CALENDARIO CARGADO · ACTUALIZACIÓN AUTOMÁTICA':'● RESULTADOS EN TIEMPO REAL';document.getElementById('round').textContent=d.jornada;matches.forEach(m=>{if(!state[m.id])state[m.id]={pick:m.pick||null};else if(m.pick)state[m.id].pick=m.pick});render()}catch(e){console.warn(e)}}
async function save(){const predictions={};matches.forEach(m=>{const p=getPred(m.id);if(p)predictions[m.id]=p});const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({round,predictions})});const b=document.getElementById('save');b.textContent=r.ok?'✓ APUESTA GUARDADA':'ERROR AL GUARDAR';setTimeout(()=>b.textContent='💾   GUARDAR MI APUESTA',1800)}
async function results(){const r=await fetch('/api/check?round='+round,{cache:'no-store'}),d=await r.json();showSummary(d);d.results.forEach(x=>{const m=matches.find(v=>v.id===x.id);if(m){m.actual=x.actual;m.score=x.score;m.live=x.live;m.status_label=x.status_label;m.elapsed=x.elapsed}});render();document.getElementById('summary').scrollIntoView({behavior:'smooth',block:'center'})}
function showSummary(d){document.getElementById('summary').classList.remove('hidden');document.getElementById('prize').textContent=eur(d.prize);document.getElementById('hits').textContent=d.hits;document.getElementById('pending').textContent=d.pending;document.getElementById('errors').textContent=d.errors}
async function mySummary(){const r=await fetch('/api/summary',{cache:'no-store'}),d=await r.json();showSummary(d);document.getElementById('roundSummary').innerHTML=d.rounds.length?'<table class="admin-table"><tr><th>Jornada</th><th>Aciertos</th><th>Fallos</th><th>Pend.</th><th>Premio</th></tr>'+d.rounds.map(x=>`<tr><td>${x.round}</td><td>${x.hits}</td><td>${x.errors}</td><td>${x.pending}</td><td>${eur(x.prize)}</td></tr>`).join('')+'</table>':'<div class="admin-note">Todavía no hay apuestas guardadas en jornadas anteriores.</div>';document.getElementById('summary').scrollIntoView({behavior:'smooth',block:'center'})}
async function init(){const r=await fetch('/api/me');if(!r.ok){location.href='/login';return}const d=await r.json();document.getElementById('account').innerHTML=esc(d.username)+' <span>⌄</span>';if(d.is_admin)document.getElementById('adminTab').classList.remove('hidden');await load()}
function adminError(d){if(d&&d.error)alert(d.error)}
async function adminPanel(){document.getElementById('admin').classList.remove('hidden');document.getElementById('matches').classList.add('hidden');document.getElementById('save').classList.add('hidden');await renderAdmin()}
async function renderAdmin(){const d=await (await fetch('/api/admin/overview')).json();let h='<div class="admin-tabs"><button class="active" onclick="renderAdmin()">Usuarios</button><button onclick="adminBets()">Apuestas</button></div><h3>Clasificación interna</h3><table class="admin-table"><tr><th>Usuario</th><th>Aciertos</th><th>Premio</th><th>Pend.</th></tr>';d.users.forEach(u=>h+=`<tr><td>${esc(u.username)}</td><td>${u.hits}</td><td>${eur(u.prize)}</td><td>${u.pending}</td></tr>`);h+='</table><h3 style="margin-top:20px">Crear usuario</h3><div class="admin-row"><input id="nu" placeholder="Usuario"><input id="np" placeholder="Contraseña" type="password"><button class="admin-btn" onclick="createUser()">CREAR</button></div><div class="admin-note">Las contraseñas se cambian desde aquí; no se muestran en claro.</div><div id="users" style="margin-top:12px"></div>';document.getElementById('adminContent').innerHTML=h;loadUsers()}
async function loadUsers(){const d=await (await fetch('/api/admin/users')).json();document.getElementById('users').innerHTML=d.users.map(u=>`<div class="admin-user-card"><b>${esc(u.username)}</b> ${u.is_admin?'(ADMIN)':''} — ${u.active?'Activo':'Inactivo'} ${!u.is_admin?`<div class="admin-row"><button class="admin-btn secondary" onclick="resetPw('${encodeURIComponent(u.username)}')">CAMBIAR CONTRASEÑA</button><button class="admin-btn secondary" onclick="toggleUser('${encodeURIComponent(u.username)}',${u.active})">${u.active?'DESACTIVAR':'ACTIVAR'}</button><button class="admin-btn danger" onclick="deleteUser('${encodeURIComponent(u.username)}')">ELIMINAR</button></div>`:''}</div>`).join('')}
async function createUser(){const u=document.getElementById('nu').value.trim(),p=document.getElementById('np').value;if(!u||!p)return alert('Indica usuario y contraseña');const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();if(!r.ok)return adminError(d);renderAdmin()}
async function resetPw(enc){const u=decodeURIComponent(enc),p=prompt('Nueva contraseña para '+u);if(!p)return;const r=await fetch('/api/admin/users/'+encodeURIComponent(u),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok)alert(d.error||'Error');else alert('Contraseña cambiada correctamente')}
async function toggleUser(enc,active){const u=decodeURIComponent(enc);const r=await fetch('/api/admin/users/'+encodeURIComponent(u),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:!active})});const d=await r.json();if(!r.ok)return alert(d.error||'Error');renderAdmin()}
async function deleteUser(enc){const u=decodeURIComponent(enc);if(!confirm('¿Eliminar '+u+' y todas sus apuestas?'))return;const r=await fetch('/api/admin/users/'+encodeURIComponent(u),{method:'DELETE'});const d=await r.json();if(!r.ok)return alert(d.error||'Error');renderAdmin()}
async function adminBets(){const d=await (await fetch('/api/admin/bets?round='+round)).json();const users=await (await fetch('/api/admin/users')).json();let h='<div class="admin-tabs"><button onclick="renderAdmin()">Usuarios</button><button class="active" onclick="adminBets()">Apuestas</button></div><div class="admin-row"><button class="admin-btn secondary" onclick="adminBetsRound(-1)">‹</button><b>Jornada '+round+'</b><button class="admin-btn secondary" onclick="adminBetsRound(1)">›</button></div><div class="admin-note">Aquí puedes consultar las apuestas guardadas por usuario.</div><div style="margin-top:12px">';users.users.filter(u=>u.active).forEach(u=>{const bs=d.bets.filter(x=>x.username===u.username);h+=`<div class="admin-user-card"><b>${esc(u.username)}</b><div class="admin-note">${bs.length} pronósticos guardados</div><div class="admin-row">${bs.map(x=>`<span style="background:#20252b;padding:6px 8px;border-radius:7px">${esc(x.match_id)}: <b>${x.pick}</b></span>`).join(' ')||'<span class="admin-note">Sin apuesta</span>'}</div></div>`});h+='</div>';document.getElementById('adminContent').innerHTML=h}
async function adminBetsRound(delta){round=Math.max(5,Math.min(38,round+delta));document.getElementById('round').textContent=round;await adminBets()}
document.getElementById('save').onclick=save;document.getElementById('resultTab').onclick=results;document.getElementById('bottomResults').onclick=results;document.getElementById('betTab').onclick=mySummary;document.getElementById('bottomBet').onclick=mySummary;document.getElementById('adminTab').onclick=adminPanel;document.getElementById('bottomRound').onclick=()=>{document.getElementById('admin').classList.add('hidden');document.getElementById('matches').classList.remove('hidden');document.getElementById('save').classList.remove('hidden');document.getElementById('matches').scrollIntoView({behavior:'smooth'})};document.getElementById('prev').onclick=()=>{if(round>5){round--;document.getElementById('summary').classList.add('hidden');load()}};document.getElementById('next').onclick=()=>{if(round<38){round++;document.getElementById('summary').classList.add('hidden');load()}};init();setInterval(load,15000);
</script>
</body></html>
