<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiniela Mediamarkera</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><div class="brand"><img src="/rfmf_logo.svg"><div><span>QUINIELA</span> <b>MEDIAMARKERA</b></div></div><button class="account" id="account">RFM⌄</button></header>
<main><section class="hero"><div class="round-nav"><button id="prev">‹</button><div><h1>JORNADA <strong id="round">5</strong></h1><p>LaLiga 2026/2027</p></div><button id="next">›</button></div><div class="open">● ABIERTA</div></section>
<section class="prize"><small>PREMIO POR ACIERTO</small><strong>100.000 €</strong><div id="source">● CALENDARIO CARGADO · ACTUALIZACIÓN AUTOMÁTICA</div></section>
<div class="quick"><button id="betTab">📝 <span>Mi apuesta</span></button><button id="resultTab">📊 <span>Resultados</span></button><button id="adminTab" class="hidden">⚙️ <span>Administración</span></button></div>
<section id="summary" class="summary"><div class="sumhead"><b>🏆 RESUMEN DE MI APUESTA</b><strong id="prize">0 €</strong></div><div class="stats"><div><b id="hits">0</b><small>ACIERTOS</small></div><div><b id="pending">0</b><small>PENDIENTES</small></div><div><b id="errors">0</b><small>FALLOS</small></div></div><div id="roundSummary" class="roundSummary"></div></section>
<section id="matches" class="matches"><div class="loading">Cargando partidos…</div></section><button id="save" class="save">💾 &nbsp; GUARDAR MI APUESTA</button>
<section id="admin" class="admin hidden"><div class="adminhead"><h2>⚙️ Administración</h2><button id="closeAdmin">Cerrar</button></div><div class="adminGrid"><div class="panel"><h3>Usuarios</h3><div class="create"><input id="newUser" placeholder="Usuario"><input id="newPass" placeholder="Contraseña"><button id="createUser">Crear usuario</button></div><div id="users"></div></div><div class="panel"><h3>Resumen de participantes</h3><div id="overview"></div></div></div></section></main>
<footer><button class="active" id="bottomHome">⚽<small>Jornada</small></button><button id="bottomBet">📝<small>Mi apuesta</small></button><button id="bottomResults">📊<small>Resultados</small></button><button onclick="location.href='/logout'">↪<small>Salir</small></button></footer>
<script>
let round=5,matches=[];const state={};let me=null;const eur=n=>new Intl.NumberFormat('es-ES').format(n)+' €';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);function getPred(id){return state[id]?.pick||null}function setPred(id,p){state[id]={...(state[id]||{}),pick:p}}
function render(){let root=$('matches');root.innerHTML='';if(!matches.length){root.innerHTML='<div class="empty">No se han podido cargar los partidos.</div>';return}matches.forEach((m,i)=>{let p=getPred(m.id),a=m.actual,label='PENDIENTE',cls='pending';if(m.live){label=(m.status_label||'EN DIRECTO')+(m.elapsed?' · '+m.elapsed:"'");cls='liveStatus'}else if(a){if(p===a){label='✓ ACIERTO · +100.000 €';cls='hit'}else if(p){label='✕ FALLADO';cls='miss'}else label='RESULTADO',cls='result'}else if(m.status==='PST')label='APLAZADO';else if(m.status==='CANC')label='CANCELADO',cls='miss';let art=document.createElement('article');art.className='match';art.innerHTML=`<div class="number">${i+1}</div><div class="teams"><div>${esc(m.home)}</div><div>${esc(m.away)}</div><small>${m.date?new Date(m.date).toLocaleString('es-ES',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</small></div><div class="choices">${['1','X','2'].map(v=>`<button class="${p===v?'selected':''}" data-id="${esc(m.id)}" data-pick="${v}">${v}</button>`).join('')}<div class="status ${cls}">${m.score?esc(m.score)+' · ':''}${label}</div></div>`;root.appendChild(art)});root.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{setPred(b.dataset.id,b.dataset.pick);render()})}
async function load(){try{let r=await fetch('/api/matches?round='+round,{cache:'no-store'});if(!r.ok){location.href='/login';return}let d=await r.json();matches=d.matches||[];$('round').textContent=d.jornada;$('source').textContent=d.api_error?'● CALENDARIO DE RESPALDO · RESULTADOS EN DIRECTO AUTOMÁTICOS':'● RESULTADOS EN TIEMPO REAL · ACTUALIZACIÓN AUTOMÁTICA';matches.forEach(m=>{if(!state[m.id])state[m.id]={pick:m.pick||null};});render()}catch(e){$('matches').innerHTML='<div class="empty">Error cargando los partidos. Recarga la página.</div>'}}
async function results(){let r=await fetch('/api/check?round='+round,{cache:'no-store'});let d=await r.json();$('summary').classList.remove('hidden');$('prize').textContent=eur(d.prize);$('hits').textContent=d.hits;$('pending').textContent=d.pending;$('errors').textContent=d.errors;matches.forEach(m=>{let x=d.results.find(v=>v.id===m.id);if(x){m.actual=x.actual;m.score=x.score;m.live=x.live;m.finished=x.finished;m.status=x.status;m.status_label=x.status_label;m.elapsed=x.elapsed}});render();$('summary').scrollIntoView({behavior:'smooth',block:'start'});await loadMySummary()}
async function loadMySummary(){let r=await fetch('/api/summary');if(!r.ok)return;let d=await r.json();$('prize').textContent=eur(d.prize);$('hits').textContent=d.hits;$('pending').textContent=d.pending;$('errors').textContent=d.errors;$('roundSummary').innerHTML=d.rounds.length?'<h4>Jornadas guardadas</h4>'+d.rounds.map(x=>`<div class="rs"><b>Jornada ${x.round}</b><span>✓ ${x.hits} · ⏳ ${x.pending} · ✕ ${x.errors}</span><strong>${eur(x.prize)}</strong></div>`).join(''):'<p>Aún no hay apuestas guardadas en jornadas anteriores.</p>'}
async function save(){let predictions={};matches.forEach(m=>{let p=getPred(m.id);if(p)predictions[m.id]=p});let r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({round,predictions})});let d=await r.json();let b=$('save');b.textContent=r.ok&&d.saved?'✓ APUESTA GUARDADA ('+d.saved+')':r.ok?'⚠️ NO HAY PRONÓSTICOS':'ERROR AL GUARDAR';setTimeout(()=>b.textContent='💾   GUARDAR MI APUESTA',1800);await loadMySummary()}
async function admin(){let r=await fetch('/api/admin/users');if(!r.ok){alert('Sin permisos de administrador');return}let d=await r.json();$('admin').classList.remove('hidden');$('matches').classList.add('hidden');$('save').classList.add('hidden');$('summary').classList.add('hidden');$('users').innerHTML=d.users.map(u=>`<div class="user"><div><b>${esc(u.username)}</b>${u.is_admin?' <em>ADMIN</em>':''}<small>${u.active?'Activo':'Bloqueado'}</small></div><div><button onclick="resetPass('${encodeURIComponent(u.username)}')">🔑 Contraseña</button>${!u.is_admin?`<button onclick="toggleUser('${encodeURIComponent(u.username)}',${!u.active})">${u.active?'Bloquear':'Activar'}</button><button onclick="deleteUser('${encodeURIComponent(u.username)}')">🗑️</button>`:''}</div></div>`).join('');let o=await (await fetch('/api/admin/overview')).json();$('overview').innerHTML=o.users.map(x=>`<div class="overview"><b>${esc(x.username)}</b><span>${x.hits} aciertos · ${x.pending} pendientes · ${x.errors} fallos</span><strong>${eur(x.prize)}</strong></div>`).join('')||'<p>No hay participantes.</p>'}
async function createUser(){let u=$('newUser').value.trim(),p=$('newPass').value.trim();if(!u||!p)return alert('Introduce usuario y contraseña');let r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});let d=await r.json();if(!r.ok)return alert(d.error);$('newUser').value='';$('newPass').value='';admin()}
async function resetPass(u){u=decodeURIComponent(u);let p=prompt('Nueva contraseña para '+u);if(!p)return;let r=await fetch('/api/admin/users/'+encodeURIComponent(u),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});let d=await r.json();alert(r.ok?'Contraseña actualizada':d.error)}
async function toggleUser(u,a){u=decodeURIComponent(u);let r=await fetch('/api/admin/users/'+encodeURIComponent(u),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:a})});if(!r.ok){let d=await r.json();alert(d.error)}admin()}
async function deleteUser(u){u=decodeURIComponent(u);if(!confirm('¿Eliminar usuario y todas sus apuestas?'))return;await fetch('/api/admin/users/'+encodeURIComponent(u),{method:'DELETE'});admin()}
async function init(){let r=await fetch('/api/me');if(r.ok){me=await r.json();$('account').textContent=me.username+'⌄';if(me.is_admin)$('adminTab').classList.remove('hidden')}await load();await loadMySummary()}
$('save').onclick=save;$('resultTab').onclick=results;$('bottomResults').onclick=results;$('betTab').onclick=()=>$('matches').scrollIntoView({behavior:'smooth'});$('bottomBet').onclick=()=>$('matches').scrollIntoView({behavior:'smooth'});$('prev').onclick=()=>{if(round>5){round--;load();loadMySummary()}};$('next').onclick=()=>{if(round<38){round++;load();loadMySummary()}};$('adminTab').onclick=admin;$('closeAdmin').onclick=()=>{ $('admin').classList.add('hidden');$('matches').classList.remove('hidden');$('save').classList.remove('hidden');$('summary').classList.remove('hidden');load()};$('createUser').onclick=createUser;$('bottomHome').onclick=()=>scrollTo({top:0,behavior:'smooth'});init();setInterval(load,15000);setInterval(results,30000);
</script></body></html>
